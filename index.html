<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra Académica con IA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #121826; color: #fff; }
    header { display: flex; gap: 10px; padding: 10px 15px; background: #1e293b; align-items: center; flex-wrap: wrap; }
    button, input { padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    button { background: #3b82f6; color: #fff; }
    button:hover { background: #2563eb; }
    .danger { background: #ef4444; }
    .danger:hover { background: #dc2626; }
    #canvas-container { flex: 1; position: relative; background: #ffffff; cursor: crosshair; }
    canvas { position: absolute; top: 0; left: 0; }
    .grid-bg {
      background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                        linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body>
  <header>
    <button id="btn-draw">✏️ Lapiz</button>
    <button id="btn-erase">🧹 Borrador</button>
    <button id="btn-clear" class="danger">🗑️ Limpiar Todo</button>
    <button id="btn-ai">✨ Digitalizar con IA</button>
    <input type="password" id="api-key" placeholder="Gemini API Key (Opcional)" style="width: 200px;">
  </header>

  <div id="canvas-container" class="grid-bg">
    <canvas id="paintCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let mode = 'draw';

    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', draw);

    function draw(e) {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      ctx.lineWidth = mode === 'erase' ? 20 : 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = mode === 'erase' ? '#ffffff' : '#000000';

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    document.getElementById('btn-draw').onclick = () => mode = 'draw';
    document.getElementById('btn-erase').onclick = () => mode = 'erase';
    document.getElementById('btn-clear').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

    document.getElementById('btn-ai').onclick = async () => {
      const apiKey = document.getElementById('api-key').value.trim();
      if (!apiKey) {
        alert('Por favor ingresá tu Gemini API Key para reconocer la fórmula.');
        return;
      }

      // Crear canvas b&w sin cuadrícula
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.fillStyle = '#FFFFFF';
      tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
      tempCtx.drawImage(canvas, 0, 0);

      const base64Image = tempCanvas.toDataURL('image/jpeg').split(',')[1];

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "Convierte este dibujo manuscrito de matemática/física a código LaTeX limpio. Devuelve SOLAMENTE la expresión en LaTeX, sin bloques de código markdown ni texto adicional." },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        const latex = data.candidates[0].content.parts[0].text.trim();
        alert('Fórmula reconocida:\n' + latex);
      } catch (err) {
        alert('Error al procesar con IA: ' + err.message);
      }
    };
  </script>
</body>
</html>
